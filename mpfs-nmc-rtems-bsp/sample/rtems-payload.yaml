# ==============================================================================
# HSS Payload Configuration - RTEMS Application
# ==============================================================================

set-name: 'PolarFire-SoC-HSS::RTEMS'

# Define entry execution points for the U54 Application Cores
hart-entry-points: {
  u54_1: '0x1000000000',
  u54_2: '0x1000000000',
  u54_3: '0x1000000000',
  u54_4: '0x1000000000'
}

# Payload definition mapping the application binary to application harts
payloads:
  ticker: {
    exec-addr: '0x1000000000',
    owner-hart: u54_1,
    secondary-hart: u54_2,
    secondary-hart: u54_3,
    secondary-hart: u54_4,
    priv-mode: prv_m,
    skip-opensbi: true
  }