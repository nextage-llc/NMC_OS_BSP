# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-nmc"
BBFILE_PATTERN_meta-nmc = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-nmc = "6"

LAYERDEPENDS_meta-nmc = "core"
LAYERSERIES_COMPAT_meta-nmc = "scarthgap"

# Root of mpfs-nmc-linux-bsp (this layer lives at <bsp>/yocto/meta-nmc).
# The bbappends pull the NMC device trees from <bsp>/linux and <bsp>/uboot,
# the same files the Buildroot flow uses, so there is only one copy of each.
NMC_BSP_DIR := "${LAYERDIR}/../.."
